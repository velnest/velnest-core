services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - '54322:5432'
    environment:
      POSTGRES_USER: velnest
      POSTGRES_PASSWORD: velnest
      POSTGRES_DB: velnest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velnest -d velnest']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
