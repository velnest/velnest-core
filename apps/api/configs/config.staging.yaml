# Staging. No credentials live here: DATABASE_URL must be provided by the
# environment (Supabase transaction pooler, port 6543).
# Vercel Go is serverless, so keep the pool small and use the simple protocol
# (the transaction pooler does not support prepared statements).
server:
  port: 7979

cors:
  allowed_origins:
    - https://staging.velnest.example # TODO: replace with the real staging web origin
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  allowed_headers: ["Content-Type", "Authorization", "X-Request-ID", "X-API-Key"]
  allow_credentials: true

database:
  prefer_simple_protocol: true
  max_open_conns: 5
  max_idle_conns: 2
  conn_max_lifetime: 5m
  conn_max_idle_time: 1m

otel:
  endpoint: "" # set OTEL_EXPORTER_OTLP_ENDPOINT to enable tracing
