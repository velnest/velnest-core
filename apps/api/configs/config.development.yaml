# Local development. The docker-compose Postgres URL is a public local default,
# not a secret. Override with DATABASE_URL.
server:
  port: 7979

cors:
  allowed_origins:
    - "http://localhost:4321" # Astro dev server (apps/web)
    - "http://localhost:7979"
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  allowed_headers: ["Content-Type", "Authorization", "X-Request-ID", "X-API-Key"]
  allow_credentials: true

database:
  url: "postgres://velnest:velnest@localhost:54322/velnest?sslmode=disable"
  prefer_simple_protocol: false
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

otel:
  endpoint: "" # set OTEL_EXPORTER_OTLP_ENDPOINT to enable tracing
